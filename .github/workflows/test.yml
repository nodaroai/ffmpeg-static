name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: bash -n build.sh && bash -n compare-stock.sh
      - run: node --test tests/
      - name: The patch applies to the pinned ffmpeg commit
        run: |
          set -euo pipefail
          commit="$(sed -n 's/^FFMPEG_COMMIT="\(.*\)"/\1/p' build.sh)"
          git init -q ff && cd ff
          git remote add origin https://github.com/FFmpeg/FFmpeg.git
          git fetch -q --depth 1 origin "$commit"
          git checkout -q FETCH_HEAD
          for p in ../patches/*.patch; do git apply --check "$p"; done
